<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Шахид — реестр бумажных самолётиков</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
:root{
  --bg:#080c10;--cell:#0e1418;--cell2:#141b21;
  --glass:rgba(20,30,26,.55);--glass2:rgba(30,42,36,.6);
  --border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.22);
  --text:#eef7f1;--text2:#a7c2b6;--text3:#6b8679;
  --mint:#4ade80;--mint2:#22c55e;--mint3:#86efac;--mint-soft:rgba(74,222,128,.15);
  --red:#f87171;--red-soft:rgba(248,113,113,.15);
  --amber:#facc15;--amber-soft:rgba(250,204,21,.15);
  --blue:#60a5fa;--blue-soft:rgba(96,165,250,.15);
  --purple:#c084fc;--purple-soft:rgba(192,132,252,.15);
  --cyan:#22d3ee;--cyan-soft:rgba(34,211,238,.15);
  --shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);
}
html,body{height:100%;overflow:hidden;width:100%}
body{
  font-family:'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif;
  color:var(--text);
  background:var(--bg);
  background-image:
    linear-gradient(rgba(74,222,128,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(74,222,128,.08) 1px,transparent 1px);
  background-size:32px 32px;
  background-position:center center;
  display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased;
  position:relative;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%,rgba(74,222,128,.18),transparent 45%),
    radial-gradient(circle at 85% 15%,rgba(96,165,250,.14),transparent 50%),
    radial-gradient(circle at 75% 85%,rgba(192,132,252,.14),transparent 50%),
    radial-gradient(circle at 20% 80%,rgba(244,114,182,.10),transparent 50%);
}
#app{
  width:100%;height:100vh;height:100dvh;max-width:760px;
  background:var(--glass);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-left:1px solid var(--border2);
  border-right:1px solid var(--border2);
  display:flex;flex-direction:column;
  position:relative;z-index:1;overflow:hidden;
}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes menuUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.header{
  display:flex;align-items:center;gap:10px;
  padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--glass2);
  backdrop-filter:blur(30px) saturate(180%);
  border-bottom:1px solid var(--border);
  z-index:50;flex-shrink:0;position:relative;
}
.header::after{
  content:'';position:absolute;left:20%;right:20%;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--mint),transparent);
}
.logo{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--mint3),var(--mint),var(--mint2));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;font-weight:900;flex-shrink:0;
  box-shadow:0 4px 18px rgba(74,222,128,.5),inset 0 1px 0 rgba(255,255,255,.4);
  animation:floatY 3s infinite;
}
.brand-wrap{flex:1;min-width:0;overflow:hidden}
.brand{font-size:20px;font-weight:900;letter-spacing:-.3px;white-space:nowrap}
.brand span{color:var(--mint)}
.sub{font-size:10px;color:var(--text2);margin-top:3px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  color:var(--text);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.icon-btn:active{transform:scale(.94)}
.header-user{
  display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;
  background:var(--mint-soft);border:1px solid var(--mint);
  font-size:12px;font-weight:800;color:var(--mint);cursor:pointer;max-width:130px;
}
.header-user .uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.page{
  display:none;position:absolute;inset:0;
  padding:14px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.page.active{display:block;animation:slideUp .35s}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{
  background:var(--glass2);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:16px;
  padding:14px 6px;text-align:center;position:relative;
  box-shadow:var(--shadow);overflow:hidden;
}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--mint),transparent)}
.stat.red::before{background:linear-gradient(90deg,transparent,var(--red),transparent)}
.stat .num{font-size:22px;font-weight:900;color:var(--mint)}
.stat.red .num{color:var(--red)}
.stat .lbl{font-size:9.5px;color:var(--text2);margin-top:5px;text-transform:uppercase;font-weight:800}

.search-box{position:relative;margin-bottom:12px}
.search-box input{
  width:100%;padding:14px 16px 14px 44px;border-radius:16px;
  border:1px solid var(--border);background:rgba(255,255,255,.06);
  backdrop-filter:blur(20px);color:var(--text);font-size:14px;outline:none;
  box-shadow:var(--shadow);
}
.search-box input:focus{border-color:var(--mint)}
.search-box .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mint);font-size:15px;pointer-events:none}

.filters{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  padding:10px 16px;border-radius:13px;border:1px solid var(--border);
  background:rgba(255,255,255,.06);backdrop-filter:blur(20px);
  color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  font-family:inherit;
}
.filter.active{
  background:linear-gradient(135deg,var(--mint3),var(--mint));
  border-color:var(--mint);color:#fff;font-weight:900;
  box-shadow:0 4px 16px rgba(74,222,128,.35);
}

.plane{
  display:flex;align-items:center;gap:12px;padding:12px;
  background:var(--glass2);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:16px;margin-bottom:8px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .15s;
}
.plane:active{transform:scale(.98)}
.plane.dead{opacity:.65;border-color:var(--red)}
.plane.dead::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--red),#dc2626);
}
.plane.alive::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--mint),var(--mint2));
}
.plane .em{
  width:52px;height:52px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:26px;overflow:hidden;
}
.plane .em img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.plane .info{flex:1;min-width:0}
.plane .info .name{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.plane .info .name .tag{
  font-size:8.5px;padding:2px 7px;border-radius:6px;font-weight:900;text-transform:uppercase;
}
.tag.normal{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue)}
.tag.combat{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber)}
.tag.jet{background:var(--purple-soft);color:var(--purple);border:1px solid var(--purple)}
.tag.jetcombat{background:var(--red-soft);color:var(--red);border:1px solid var(--red)}
.plane .info .desc{font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.4}
.plane .actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.plane .actions button{
  width:38px;height:38px;border-radius:11px;border:none;
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:inherit;
}
.btn-kill{background:var(--red-soft);color:var(--red);border:1px solid var(--red)!important}
.btn-revive{background:var(--mint-soft);color:var(--mint);border:1px solid var(--mint)!important}
.btn-edit{background:rgba(255,255,255,.08);color:var(--text2);border:1px solid var(--border)!important}
.btn-del{background:var(--red-soft);color:var(--red);border:1px solid var(--red)!important}

.fab{
  position:absolute;bottom:24px;right:20px;
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,var(--mint3),var(--mint));
  border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;cursor:pointer;
  box-shadow:0 8px 24px rgba(74,222,128,.5);
  z-index:55;display:flex;align-items:center;justify-content:center;
}
.fab:active{transform:scale(.92)}

.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .ic{font-size:50px;color:var(--mint);opacity:.35;margin-bottom:14px}
.empty .t{font-size:14px;font-weight:800;color:var(--text)}
.empty .d{font-size:12px;color:var(--text3);margin-top:6px}

.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);backdrop-filter:blur(24px);
  z-index:9999;justify-content:center;align-items:center;
  padding:16px;overflow-y:auto;
}
.modal-overlay.active{display:flex;animation:slideUp .35s}
.modal-box{
  background:rgba(20,30,26,.85);backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--border2);border-radius:24px;
  padding:24px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  position:relative;
}
.modal-box h3{font-size:17px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.modal-box h3 i{color:var(--mint)}
.modal-close{float:right;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}

.field{margin-bottom:14px}
.field label{font-size:11px;color:var(--text2);display:block;margin-bottom:7px;font-weight:800;text-transform:uppercase}
.field input,.field textarea,.field select{
  width:100%;padding:13px 15px;border-radius:14px;
  border:1px solid var(--border);background:rgba(255,255,255,.06);
  color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mint)}
.field textarea{min-height:80px;resize:vertical}
.field select{cursor:pointer}
.field select option{background:#0e1418;color:#eef7f1}

.btn{
  width:100%;padding:14px;border:1px solid rgba(255,255,255,.25);border-radius:14px;
  background:linear-gradient(135deg,var(--mint3),var(--mint));
  color:#fff;font-weight:900;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:10px;font-family:inherit;
  box-shadow:0 6px 20px rgba(74,222,128,.35);
}
.btn:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--mint);border:1px solid var(--mint)}
.btn-danger{background:var(--red-soft);color:var(--red);border:1px solid var(--red);box-shadow:none}

.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);
  background:rgba(20,30,26,.92);backdrop-filter:blur(30px);
  border:1px solid var(--mint);border-radius:14px;padding:12px 20px;
  font-size:13px;font-weight:700;z-index:10000;
  transition:transform .4s;display:flex;align-items:center;gap:8px;
  pointer-events:none;max-width:90vw;
  box-shadow:0 8px 30px rgba(74,222,128,.3);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{color:var(--mint)}

.auth-box{
  text-align:center;padding:40px 20px;color:var(--text2);
}
.auth-box h2{color:var(--text);font-size:20px;font-weight:900;margin-bottom:10px}
.auth-box p{font-size:13px;margin-bottom:20px;line-height:1.5}

@media(min-width:900px){
  #app{height:calc(100vh - 40px);border-radius:28px;border:1px solid var(--border2)}
}
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <div class="logo">✈️</div>
    <div class="brand-wrap">
      <div class="brand">Ша<span>хид</span></div>
      <div class="sub">реестр бумажных самолётиков</div>
    </div>
    <div class="header-actions">
      <div class="header-user" id="userLabel" onclick="onUserClick()">
        <i class="fas fa-user"></i><span class="uname">Войти</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="page active" id="page-main">

      <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Всего</div></div>
        <div class="stat"><div class="num" id="statAlive">0</div><div class="lbl">Живых</div></div>
        <div class="stat red"><div class="num" id="statDead">0</div><div class="lbl">Убитых</div></div>
      </div>

      <div class="search-box">
        <i class="fas fa-magnifying-glass si"></i>
        <input type="text" id="searchInput" placeholder="Поиск по названию..." oninput="renderPlanes()">
      </div>

      <div class="filters">
        <button class="filter active" data-cat="all" onclick="setFilter('all',this)">Все</button>
        <button class="filter" data-cat="alive" onclick="setFilter('alive',this)">✅ Живые</button>
        <button class="filter" data-cat="dead" onclick="setFilter('dead',this)">☠️ Убитые</button>
        <button class="filter" data-cat="normal" onclick="setFilter('normal',this)">🛩 Обычные</button>
        <button class="filter" data-cat="combat" onclick="setFilter('combat',this)">⚔️ Боевые</button>
        <button class="filter" data-cat="jet" onclick="setFilter('jet',this)">🚀 Реактивные</button>
        <button class="filter" data-cat="jetcombat" onclick="setFilter('jetcombat',this)">🔥 Реактивно-боевые</button>
      </div>

      <div id="planesList"></div>

      <button class="fab" onclick="openAddPlane()" title="Добавить">
        <i class="fas fa-plus"></i>
      </button>
    </div>
  </div>

</div>

<input type="file" id="planePhotoInput" accept="image/*" style="display:none">
<input type="file" id="avatarFileInput" accept="image/*" style="display:none">

<!-- Auth Modal -->
<div class="modal-overlay" id="authOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('authOverlay')">✕</button>
    <h3><i class="fas fa-right-to-bracket"></i> Вход</h3>
    <div class="field"><label>Ник</label><input id="authNick" placeholder="nexik" maxlength="20" autocomplete="username"></div>
    <div class="field"><label>Пароль</label><input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password"></div>
    <div id="authErr" style="display:none;font-size:12px;color:var(--red);text-align:center;padding:8px;background:var(--red-soft);border-radius:10px;margin-bottom:10px"></div>
    <button class="btn" onclick="doAuth()">Войти / Создать</button>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:10px;line-height:1.4">
      Логин общий с elkalive. Домен @elkalive.app
    </div>
  </div>
</div>

<!-- Add/Edit Plane Modal -->
<div class="modal-overlay" id="planeOverlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('planeOverlay')">✕</button>
    <h3 id="planeModalTitle"><i class="fas fa-plus"></i> Новый самолётик</h3>
    <div class="field"><label>Название</label><input id="plName" placeholder="СШ1, Ш2, РШ9..." maxlength="30"></div>
    <div class="field"><label>Тип</label>
      <select id="plType">
        <option value="normal">🛩 Обычный</option>
        <option value="combat">⚔️ Боевой</option>
        <option value="jet">🚀 Реактивный</option>
        <option value="jetcombat">🔥 Реактивно-боевой</option>
      </select>
    </div>
    <div class="field"><label>Описание</label><textarea id="plDesc" placeholder="Из чего сделан, как летает..."></textarea></div>
    <div class="field">
      <label>Фото</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="plPhoto" placeholder="URL или загрузи" style="flex:1">
        <button type="button" class="btn btn-ghost" style="width:auto;padding:0 16px;margin:0" onclick="document.getElementById('planePhotoInput').click()"><i class="fas fa-upload"></i></button>
      </div>
      <div id="plPhotoProgress" style="font-size:11px;color:var(--text2);margin-top:6px"></div>
    </div>
    <button class="btn" onclick="savePlane()">Сохранить</button>
    <button class="btn btn-danger" id="plDeleteBtn" style="display:none" onclick="deletePlane()">Удалить</button>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-box" style="text-align:center">
    <h3 style="justify-content:center"><i class="fas fa-triangle-exclamation" style="color:var(--red)"></i> Подтверждение</h3>
    <div id="confirmTitle" style="font-size:14px;font-weight:800;margin-bottom:8px">Удалить?</div>
    <div id="confirmDesc" style="font-size:12px;color:var(--text2);margin-bottom:16px"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="closeModal('confirmOverlay')" style="margin:0">Отмена</button>
      <button class="btn btn-danger" id="confirmYes" style="margin:0">Да</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check"></i><span id="toastText"></span></div>

<script>
/* ============================================================
   ШАХИД — реестр бумажных самолётиков
   Firebase: тот же проект nexik-63c6c, ветка planes
   ============================================================ */

const firebaseConfig={
  apiKey:"AIzaSyCvC2P3ehBSFmZIMvieD9KYouGyjno4T70",
  authDomain:"nexik-63c6c.firebaseapp.com",
  databaseURL:"https://nexik-63c6c-default-rtdb.firebaseio.com",
  projectId:"nexik-63c6c"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

const IMGBB_KEY="e95d7591bce7e9d9ab12197fd5eb0b26";
const EMAIL_DOMAIN="@elkalive.app";

let currentUID=null;
let currentUser=null;
let planes={};
let currentFilter='all';
let editingId=null;

/* ============ HELPERS ============ */
function $(id){return document.getElementById(id)}
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
function escUrl(u){return String(u||'').replace(/"/g,'%22').replace(/</g,'%3C').replace(/>/g,'%3E')}
function toast(msg,icon){
  const t=$('toast');
  t.querySelector('i').className='fas fa-'+(icon||'check');
  $('toastText').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function openModal(id){$(id).classList.add('active')}
function closeModal(id){$(id).classList.remove('active')}
function showConfirm(title,desc,cb){
  $('confirmTitle').textContent=title;
  $('confirmDesc').textContent=desc||'';
  $('confirmYes').onclick=()=>{closeModal('confirmOverlay');cb()};
  openModal('confirmOverlay');
}

/* ============ AUTH ============ */
function onUserClick(){
  if(!currentUID){openModal('authOverlay');return}
  showConfirm('Выйти из аккаунта?','',()=>{
    auth.signOut().then(()=>toast('Вы вышли','right-from-bracket'));
  });
}

function doAuth(){
  const nick=$('authNick').value.trim().toLowerCase();
  const pass=$('authPass').value;
  const err=$('authErr');
  err.style.display='none';
  if(!nick||!pass){err.textContent='Заполни ник и пароль';err.style.display='block';return}
  if(!/^[a-z0-9_]{3,20}$/.test(nick)){err.textContent='Ник: 3-20 символов a-z 0-9 _';err.style.display='block';return}
  if(pass.length<6){err.textContent='Пароль от 6 символов';err.style.display='block';return}
  const email=nick+EMAIL_DOMAIN;
  auth.signInWithEmailAndPassword(email,pass)
    .then(()=>{closeModal('authOverlay');toast('Добро пожаловать','hand-wave')})
    .catch(()=>{
      auth.createUserWithEmailAndPassword(email,pass)
        .then(c=>{
          const uid=c.user.uid;
          return db.ref('usernames/'+nick).transaction(cur=>{
            if(cur!==null&&cur!==undefined)return;
            return uid;
          }).then(r=>{
            if(!r.committed){return c.user.delete().then(()=>{throw new Error('NICK_TAKEN')})}
            return db.ref('users/'+uid).set({
              uid,username:nick,nickname:nick,isModerator:false,
              online:true,createdAt:Date.now(),lastSeen:Date.now(),
              avatar:'',bio:'',birthday:'',status:'',lang:'ru',theme:'dark'
            });
          });
        })
        .then(()=>{closeModal('authOverlay');toast('Аккаунт создан','user-plus')})
        .catch(e=>{
          if(e.message==='NICK_TAKEN'){err.textContent='Ник занят, попробуй другой';err.style.display='block';return}
          if(e.code==='auth/email-already-in-use'){err.textContent='Ник занят или неверный пароль';err.style.display='block';return}
          err.textContent='Ошибка: '+(e.message||e.code||'unknown');err.style.display='block';
        });
    });
}

auth.onAuthStateChanged(user=>{
  if(user){
    currentUID=user.uid;
    db.ref('users/'+currentUID).once('value').then(s=>{
      const d=s.val()||{};
      currentUser=d.nickname||d.username||'user';
      $('userLabel').innerHTML='<i class="fas fa-user"></i><span class="uname">'+esc(currentUser)+'</span>';
    });
    db.ref('planes').on('value',s=>{
      planes=s.val()||{};
      renderPlanes();
    });
  }else{
    currentUID=null;currentUser=null;
    $('userLabel').innerHTML='<i class="fas fa-user"></i><span class="uname">Войти</span>';
    planes={};
    renderPlanes();
  }
});

/* ============ PLANES ============ */
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  renderPlanes();
}

function renderPlanes(){
  const list=$('planesList');
  const q=($('searchInput').value||'').toLowerCase().trim();

  let items=Object.entries(planes).map(([id,v])=>({id,...v}));

  if(currentFilter==='alive')items=items.filter(p=>p.alive!==false);
  else if(currentFilter==='dead')items=items.filter(p=>p.alive===false);
  else if(currentFilter==='normal')items=items.filter(p=>p.type==='normal');
  else if(currentFilter==='combat')items=items.filter(p=>p.type==='combat');
  else if(currentFilter==='jet')items=items.filter(p=>p.type==='jet');
  else if(currentFilter==='jetcombat')items=items.filter(p=>p.type==='jetcombat');

  if(q)items=items.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q));

  items.sort((a,b)=>{
    if((a.alive!==false)!==(b.alive!==false))return a.alive!==false?-1:1;
    return (b.createdAt||0)-(a.createdAt||0);
  });

  const all=Object.values(planes);
  $('statTotal').textContent=all.length;
  $('statAlive').textContent=all.filter(p=>p.alive!==false).length;
  $('statDead').textContent=all.filter(p=>p.alive===false).length;

  if(items.length===0){
    list.innerHTML='<div class="empty"><div class="ic">✈️</div><div class="t">Пусто</div><div class="d">Добавь первый самолётик кнопкой +</div></div>';
    return;
  }

  const typeLabels={normal:'обычный',combat:'боевой',jet:'реактивный',jetcombat:'реактивно-боевой'};
  const typeIcons={normal:'🛩',combat:'⚔️',jet:'🚀',jetcombat:'🔥'};

  list.innerHTML=items.map(p=>{
    const isAlive=p.alive!==false;
    const emoji=typeIcons[p.type]||'✈️';
    const photo=p.photo?'<img src="'+escUrl(p.photo)+'" onerror="this.style.display=\'none\';this.parentNode.textContent=\''+emoji+'\'">':emoji;
    return '<div class="plane '+(isAlive?'alive':'dead')+'">'+
      '<div class="em">'+photo+'</div>'+
      '<div class="info">'+
        '<div class="name">'+esc(p.name||'Без названия')+' <span class="tag '+(p.type||'normal')+'">'+(typeLabels[p.type]||'обычный')+'</span></div>'+
        '<div class="desc">'+esc((p.desc||'').slice(0,80)||'—')+'</div>'+
      '</div>'+
      '<div class="actions">'+
        (isAlive
          ?'<button class="btn-kill" onclick="toggleAlive(\''+p.id+'\',true)" title="Убит"><i class="fas fa-skull"></i></button>'
          :'<button class="btn-revive" onclick="toggleAlive(\''+p.id+'\',false)" title="Жив"><i class="fas fa-heart"></i></button>')+
        '<button class="btn-edit" onclick="openEditPlane(\''+p.id+'\')" title="Ред."><i class="fas fa-pen"></i></button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleAlive(id,kill){
  if(!currentUID){toast('Войдите','user-lock');openModal('authOverlay');return}
  db.ref('planes/'+id+'/alive').set(kill?false:true).then(()=>{
    toast(kill?'Убит':'Жив',kill?'skull':'heart');
  });
}

/* ============ ADD/EDIT ============ */
function openAddPlane(){
  if(!currentUID){toast('Войдите','user-lock');openModal('authOverlay');return}
  editingId=null;
  $('planeModalTitle').innerHTML='<i class="fas fa-plus"></i> Новый самолётик';
  $('plName').value='';
  $('plType').value='normal';
  $('plDesc').value='';
  $('plPhoto').value='';
  $('plPhotoProgress').textContent='';
  $('plDeleteBtn').style.display='none';
  openModal('planeOverlay');
}

function openEditPlane(id){
  if(!currentUID){toast('Войдите','user-lock');openModal('authOverlay');return}
  const p=planes[id];
  if(!p)return;
  editingId=id;
  $('planeModalTitle').innerHTML='<i class="fas fa-pen"></i> Редактировать';
  $('plName').value=p.name||'';
  $('plType').value=p.type||'normal';
  $('plDesc').value=p.desc||'';
  $('plPhoto').value=p.photo||'';
  $('plPhotoProgress').textContent='';
  $('plDeleteBtn').style.display='block';
  openModal('planeOverlay');
}

function savePlane(){
  if(!currentUID){toast('Войдите','user-lock');return}
  const name=$('plName').value.trim();
  if(!name){toast('Введи название','times');return}
  const data={
    name:name,
    type:$('plType').value,
    desc:$('plDesc').value.trim(),
    photo:$('plPhoto').value.trim(),
    author:currentUser,
    updatedAt:Date.now()
  };
  if(editingId){
    db.ref('planes/'+editingId).update(data).then(()=>{
      closeModal('planeOverlay');
      toast('Сохранено','check');
    });
  }else{
    data.alive=true;
    data.createdAt=Date.now();
    db.ref('planes').push(data).then(()=>{
      closeModal('planeOverlay');
      toast('Добавлено','check');
    });
  }
}

function deletePlane(){
  if(!editingId)return;
  showConfirm('Удалить самолётик?','Это действие нельзя отменить.',()=>{
    db.ref('planes/'+editingId).remove().then(()=>{
      closeModal('planeOverlay');
      toast('Удалено','trash');
    });
  });
}

/* ============ PHOTO UPLOAD ============ */
$('planePhotoInput').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(!f)return;
  const prog=$('plPhotoProgress');
  prog.innerHTML='<i class="fas fa-spinner fa-spin"></i> Загрузка...';
  const fd=new FormData();
  fd.append('image',f);
  fd.append('key',IMGBB_KEY);
  fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd})
    .then(r=>r.json())
    .then(d=>{
      if(!d.success)throw new Error('ImgBB');
      $('plPhoto').value=d.data.url;
      prog.innerHTML='<i class="fas fa-check-circle" style="color:var(--mint)"></i> Загружено';
    })
    .catch(()=>{prog.innerHTML='<i class="fas fa-times-circle" style="color:var(--red)"></i> Ошибка'});
  e.target.value='';
});

/* ============ INIT ============ */
renderPlanes();
console.log('✈️ Шахид — реестр бумажных самолётиков');
</script>
