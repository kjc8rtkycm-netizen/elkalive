@media(min-width:900px){#app{height:calc(100vh - 40px);border-radius:28px}}
</style></head><body data-theme="dark"><div id="app">

<script>
const firebaseConfig={apiKey:"AIzaSyCvC2P3ehBSFmZIMvieD9KYouGyjno4T70",authDomain:"nexik-63c6c.firebaseapp.com",databaseURL:"https://nexik-63c6c-default-rtdb.firebaseio.com",projectId:"nexik-63c6c"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const IMGBB_KEY="e95d7591bce7e9d9ab12197fd5eb0b26";
const ADMIN_PASS="ЖОПА01231₽";
const STATUSES={alive:{lbl:'Живой',emoji:'✅',cls:'b-alive'},dead:{lbl:'Сбит',emoji:'☠️',cls:'b-dead'},repair:{lbl:'Ремонт',emoji:'🔧',cls:'b-repair'},dev:{lbl:'В разработке',emoji:'🛠',cls:'b-dev'},lost:{lbl:'Утерян',emoji:'❓',cls:'b-lost'}};
const TYPES={normal:{lbl:'Обычный',emoji:'🛩',cls:'b-normal'},combat:{lbl:'Боевой',emoji:'⚔️',cls:'b-combat'},jet:{lbl:'Реактивный',emoji:'🚀',cls:'b-jet'},jetcombat:{lbl:'Реактивно-боевой',emoji:'🔥',cls:'b-jetcombat'}};
let isAdmin=localStorage.getItem('shixidik_admin')==='1';

const DEFAULT_PLANES=[
{name:'РШБ-16 miniX2',type:'jetcombat',desc:'Реактивно-боевой. Рекорд 6.',status:'alive',year:'фев 2026',size:'miniX2',record:'6',kills:0},
{name:'БШ-11 боевой',type:'combat',desc:'Боевой.',status:'alive',year:'2025',size:'',record:'',kills:0},
{name:'Ш-15 обычный',type:'normal',desc:'Обычный.',status:'alive',year:'2026',size:'',record:'',kills:0},
{name:'РНШ-12 реактивный',type:'jet',desc:'Реактивный. Производство ночь 2025.',status:'alive',year:'ночь 2025',size:'',record:'',kills:0},
{name:'Ш-14 «Рождество»',type:'normal',desc:'Обычный, праздничный.',status:'alive',year:'',size:'',record:'',kills:0},
{name:'Ш-16 mini поставка',type:'normal',desc:'Обычный, mini.',status:'alive',year:'',size:'mini',record:'',kills:0},
{name:'Ш-13 Bisness',type:'normal',desc:'Обычный, бизнес-класс.',status:'alive',year:'',size:'',record:'',kills:0},
{name:'ШТУ-837',type:'normal',desc:'Обычный.',status:'alive',year:'',size:'',record:'',kills:0}
];
function $(id){return document.getElementById(id)}
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
function escUrl(u){return String(u||'').replace(/"/g,'%22').replace(/</g,'%3C').replace(/>/g,'%3E')}
function toast(msg,icon){const t=$('toast');t.querySelector('i').className='fas fa-'+(icon||'check');$('toastText').textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(id){$(id).classList.add('active')}
function closeModal(id){$(id).classList.remove('active')}
function showConfirm(title,desc,cb){$('confirmTitle').textContent=title;$('confirmDesc').textContent=desc||'';$('confirmYes').onclick=()=>{closeModal('confirmOverlay');cb()};openModal('confirmOverlay')}
function timeAgo(ts){if(!ts)return'';const d=Date.now()-ts;if(d<60000)return'только что';if(d<3600000)return Math.floor(d/60000)+' мин';if(d<86400000)return Math.floor(d/3600000)+' ч';return Math.floor(d/86400000)+' дн'}
function seedIfEmpty(){if(initialized)return;db.ref('planes').once('value').then(s=>{const d=s.val();if(!d||Object.keys(d).length===0){const u={},now=Date.now();DEFAULT_PLANES.forEach((p,i)=>{u['seed_'+i]={...p,createdAt:now-i*1000,author:'system'}});db.ref('planes').update(u)}});initialized=true}
db.ref('planes').on('value',s=>{planes=s.val()||{};renderAll()});
seedIfEmpty();
function toggleTheme(){const cur=document.body.getAttribute('data-theme');const n=cur==='dark'?'light':'dark';document.body.setAttribute('data-theme',n);$('themeIcon').className=n==='dark'?'fas fa-moon':'fas fa-sun';localStorage.setItem('shixidik_theme',n)}
$('themeIcon').className=(localStorage.getItem('shixidik_theme')||'dark')==='dark'?'fas fa-moon':'fas fa-sun';
document.body.setAttribute('data-theme',localStorage.getItem('shixidik_theme')||'dark');
function openAdminModal(){if(isAdmin){logoutAdmin();return}$('adminPass').value='';$('adminErr').style.display='none';openModal('adminOverlay')}
function tryAdmin(){const p=$('adminPass').value;if(p===ADMIN_PASS){isAdmin=true;localStorage.setItem('shixidik_admin','1');closeModal('adminOverlay');toast('🔓 Админ','unlock');updateAdminUI()}else{$('adminErr').textContent='Неверный пароль';$('adminErr').style.display='block'}}
function logoutAdmin(){isAdmin=false;localStorage.removeItem('shixidik_admin');toast('🔒 Выход','lock');updateAdminUI()}
function updateAdminUI(){const b=$('adminBtn');b.classList.toggle('on',isAdmin);b.innerHTML=isAdmin?'<i class="fas fa-unlock"></i>':'<i class="fas fa-lock"></i>';$('fabAdd').style.display=isAdmin?'flex':'none';$('adminLogoutBtn').style.display=isAdmin?'flex':'none';$('adminLoginBtn').style.display=isAdmin?'none':'flex';renderAll()}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter[data-cat]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAll()}
function setTypeFilter(t,btn){currentTypeFilter=t;document.querySelectorAll('.filter[data-type]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAll()}
function setSort(s,btn){currentSort=s;document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAll()}
function toggleFav(id){const i=favorites.indexOf(id);if(i>=0)favorites.splice(i,1);else favorites.push(id);localStorage.setItem('shixidik_fav',JSON.stringify(favorites));renderAll();toast(favorites.includes(id)?'⭐ Избранное':'Убрано','star')}
function incKill(id){const p=planes[id];if(!p)return;db.ref('planes/'+id+'/kills').set((p.kills||0)+1);toast('🏆 +1 сбитый')}
function renderAll(){
const q=($('searchInput').value||'').toLowerCase().trim();
let items=Object.entries(planes).map(([id,v])=>({id,...v}));
if(currentFilter==='alive')items=items.filter(p=>p.status==='alive'||p.alive===true);
else if(currentFilter==='dead')items=items.filter(p=>p.status==='dead'||p.alive===false);
else if(currentFilter==='repair')items=items.filter(p=>p.status==='repair');
else if(currentFilter==='dev')items=items.filter(p=>p.status==='dev');
else if(currentFilter==='lost')items=items.filter(p=>p.status==='lost');
else if(currentFilter==='fav')items=items.filter(p=>favorites.includes(p.id));
else if(currentFilter==='top')items=items.filter(p=>(p.kills||0)>0).sort((a,b)=>(b.kills||0)-(a.kills||0)).slice(0,5);
if(currentTypeFilter!=='all')items=items.filter(p=>(p.type||'normal')===currentTypeFilter);
if(q)items=items.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q));
if(currentSort==='default'&&currentFilter!=='top'){items.sort((a,b)=>{const na=parseInt((a.name||'').replace(/\D/g,''))||0,nb=parseInt((b.name||'').replace(/\D/g,''))||0;return na-nb})}
else if(currentSort==='recent'){items.sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))}
else if(currentSort==='status'){const ord={alive:0,repair:1,dev:2,lost:3,dead:4};items.sort((a,b)=>(ord[a.status||'alive']??5)-(ord[b.status||'alive']??5))}
else if(currentSort==='kills'){items.sort((a,b)=>(b.kills||0)-(a.kills||0))}
const all=Object.values(planes);
const getStatus=p=>p.status||(p.alive===false?'dead':'alive');
$('stTotal').textContent=all.length;
$('stAlive').textContent=all.filter(p=>getStatus(p)==='alive').length;
$('stDead').textContent=all.filter(p=>getStatus(p)==='dead').length;
$('stRepair').textContent=all.filter(p=>getStatus(p)==='repair').length;
$('stDev').textContent=all.filter(p=>getStatus(p)==='dev').length;
$('stLost').textContent=all.filter(p=>getStatus(p)==='lost').length;
$('stKills').textContent=all.reduce((s,p)=>s+(p.kills||0),0);
if(items.length===0){$('listBlock').innerHTML='<div class="empty"><div class="ic">🛩</div><div class="t">Пусто</div><div class="d">'+(isAdmin?'Добавь кнопкой +':'Войди как админ')+'</div></div>';return}
$('listBlock').innerHTML=items.map(p=>{
const st=getStatus(p);const meta=STATUSES[st]||STATUSES.alive;
const tp=p.type||'normal';const tmeta=TYPES[tp]||TYPES.normal;
const emoji=st==='dead'?'💥':st==='repair'?'🔧':st==='dev'?'🛠':st==='lost'?'❓':tmeta.emoji;
const av=p.photo?'<img src="'+escUrl(p.photo)+'" onerror="this.style.display=\'none\';this.parentNode.textContent=\''+emoji+'\'">':emoji;
const avMini=p.photo?'<span class="p-av-mini"><img src="'+escUrl(p.photo)+'"></span>':'<span class="p-av-mini">'+emoji+'</span>';
const isFav=favorites.includes(p.id);
const acts='<div class="p-acts">'+(isAdmin?'<button onclick="event.stopPropagation();incKill(\''+p.id+'\')" title="+1 сбитый">🏆</button>':'')+'<button class="'+(isFav?'fav':'')+'" onclick="event.stopPropagation();toggleFav(\''+p.id+'\')"><i class="fas fa-star"></i></button>'+(isAdmin?'<button onclick="event.stopPropagation();openEditPlane(\''+p.id+'\')"><i class="fas fa-pen"></i></button>':'')+'</div>';
return '<div class="plane status-'+st+'" onclick="openPreview(\''+p.id+'\')" oncontextmenu="event.preventDefault();quickActions(\''+p.id+'\')"><div class="p-av">'+av+'</div><div class="p-info"><div class="p-name">'+avMini+esc(p.name||'—')+' <span class="p-badge '+meta.cls+'">'+meta.emoji+'</span> <span class="p-badge '+tmeta.cls+'">'+tmeta.lbl+'</span></div><div class="p-desc">'+esc(p.desc||'—')+'</div>'+(p.kills>0?'<div class="p-kills">🏆 '+p.kills+' сбито</div>':'')+(p.updatedAt?'<div class="p-time">'+timeAgo(p.updatedAt)+'</div>':'')+'</div>'+acts+'</div>';
}).join('');
}
function quickActions(id){const p=planes[id];if(!p)return;const menu=document.createElement('div');menu.className='modal-overlay active';menu.style.zIndex=10005;menu.innerHTML='<div class="modal-box" style="max-width:300px"><button class="modal-close" onclick="this.parentNode.parentNode.remove()">✕</button><h3>'+esc(p.name)+'</h3><button class="btn btn-ghost" onclick="copyText(\''+esc(p.name)+'\');this.parentNode.parentNode.remove()">📋 Копировать имя</button><button class="btn btn-ghost" onclick="incKill(\''+id+'\');this.parentNode.parentNode.remove()">🏆 +1 сбитый</button><button class="btn btn-ghost" onclick="shareItem(\''+id+'\');this.parentNode.parentNode.remove()">📤 Поделиться</button></div>';document.body.appendChild(menu)}
function openPreview(id){const p=planes[id];if(!p)return;const st=p.status||(p.alive===false?'dead':'alive');const meta=STATUSES[st]||STATUSES.alive;const tp=p.type||'normal';const tmeta=TYPES[tp]||TYPES.normal;const emoji=st==='dead'?'💥':st==='repair'?'🔧':st==='dev'?'🛠':st==='lost'?'❓':tmeta.emoji;const av=p.photo?'<img src="'+escUrl(p.photo)+'">':emoji;
$('previewBox').innerHTML='<button class="modal-close" onclick="closeModal(\'previewOverlay\')" style="float:right">✕</button><div class="p-av">'+av+'</div><h2>'+esc(p.name||'—')+'</h2><div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px"><span class="p-badge '+meta.cls+'" style="font-size:10px;padding:5px 10px">'+meta.emoji+' '+meta.lbl+'</span><span class="p-badge '+tmeta.cls+'" style="font-size:10px;padding:5px 10px">'+tmeta.emoji+' '+tmeta.lbl+'</span></div><p>'+esc(p.desc||'Нет описания')+'</p><div class="preview-stats"><div class="preview-stat"><div class="n">'+esc(p.year||'—')+'</div><div class="l">Год</div></div><div class="preview-stat"><div class="n">'+esc(p.size||'—')+'</div><div class="l">Размер</div></div><div class="preview-stat"><div class="n">'+esc(p.record||'—')+'</div><div class="l">Рекорд</div></div><div class="preview-stat"><div class="n">'+(p.kills||0)+'</div><div class="l">Сбито</div></div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-ghost btn-small" onclick="shareItem(\''+id+'\')"><i class="fas fa-share"></i> Поделиться</button>'+(isAdmin?'<button class="btn btn-small" onclick="incKill(\''+id+'\');closeModal(\'previewOverlay\')">🏆 +1 сбитый</button>':'')+'</div>';
openModal('previewOverlay');
}
function shareItem(id){const p=planes[id];if(!p)return;const text=(p.name||'')+' — '+(p.desc||'')+' | ШIХiDik';if(navigator.share)navigator.share({title:p.name,text});else copyText(text)}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('📋 Скопировано'));else{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('📋 Скопировано')}}
function pickStatus(s){currentStatus=s;document.querySelectorAll('.status-opt').forEach(el=>el.classList.toggle('sel',el.dataset.s===s))}
function openAddPlane(){if(!isAdmin){toast('Нужен админ','lock');return}editingId=null;currentStatus='alive';$('modalTitle').innerHTML='🛩 Новый шахед';['plName','plYear','plSize','plRecord','plDesc','plPhoto'].forEach(k=>$(k).value='');$('plType').value='normal';$('plPhotoProgress').textContent='';$('plDeleteBtn').style.display='none';$('plDupBtn').style.display='none';pickStatus('alive');const draft=localStorage.getItem('shixidik_draft');if(draft){const d=JSON.parse(draft);if(d.name)$('plName').value=d.name;if(d.desc)$('plDesc').value=d.desc}openModal('planeOverlay')}
function openEditPlane(id){if(!isAdmin)return;const p=planes[id];if(!p)return;editingId=id;currentStatus=p.status||(p.alive===false?'dead':'alive');$('modalTitle').innerHTML='✏️ Редактировать';$('plName').value=p.name||'';$('plType').value=p.type||'normal';$('plYear').value=p.year||'';$('plSize').value=p.size||'';$('plRecord').value=p.record||'';$('plDesc').value=p.desc||'';$('plPhoto').value=p.photo||'';$('plPhotoProgress').textContent='';$('plDeleteBtn').style.display='block';$('plDupBtn').style.display='block';pickStatus(currentStatus);openModal('planeOverlay')}
function savePlane(){if(!isAdmin)return;const name=$('plName').value.trim();if(!name){toast('Введи название','times');return}const data={name,status:currentStatus,type:$('plType').value,year:$('plYear').value.trim(),size:$('plSize').value.trim(),record:$('plRecord').value.trim(),desc:$('plDesc').value.trim(),photo:$('plPhoto').value.trim(),updatedAt:Date.now()};if(editingId){db.ref('planes/'+editingId).update(data).then(()=>{closeModal('planeOverlay');toast('💾 Сохранено')})}else{data.createdAt=Date.now();data.alive=currentStatus==='alive';data.kills=0;db.ref('planes').push(data).then(()=>{closeModal('planeOverlay');toast('🛩 Добавлено')})}}
function dupPlane(){if(!isAdmin||!editingId)return;const p=planes[editingId];if(!p)return;const copy={...p};delete copy.createdAt;copy.name=(p.name||'')+' (копия)';copy.createdAt=Date.now();copy.updatedAt=Date.now();db.ref('planes').push(copy).then(()=>{closeModal('planeOverlay');toast('📋 Дублировано')})}
function deletePlane(){if(!isAdmin||!editingId)return;showConfirm('Удалить шахеда?','Нельзя отменить.',()=>{db.ref('planes/'+editingId).remove().then(()=>{closeModal('planeOverlay');toast('🗑 Удалено')})})}
$('planePhotoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const prog=$('plPhotoProgress');prog.innerHTML='<i class="fas fa-spinner fa-spin"></i> Загрузка...';const fd=new FormData();fd.append('image',f);fd.append('key',IMGBB_KEY);fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{if(!d.success)throw new Error('ImgBB');$('plPhoto').value=d.data.url;prog.innerHTML='<i class="fas fa-check-circle" style="color:#4ade80"></i> Загружено'}).catch(()=>{prog.innerHTML='<i class="fas fa-times-circle" style="color:#f87171"></i> Ошибка'});e.target.value=''});
function openStatsModal(){const all=Object.values(planes);const byType={normal:0,combat:0,jet:0,jetcombat:0};all.forEach(p=>{byType[p.type||'normal']++});const max=Math.max(...Object.values(byType),1);const top=[...all].sort((a,b)=>(b.kills||0)-(a.kills||0)).slice(0,3);
$('statsBody').innerHTML='<div style="font-size:13px;color:#7a88a8;margin-bottom:10px">Всего шахедов: <b style="color:#e64a4a">'+all.length+'</b></div><div class="bar-chart">'+Object.entries(byType).map(([t,n])=>'<div class="bar" style="height:'+(n/max*100)+'%" data-l="'+TYPES[t].emoji+' '+n+'"></div>').join('')+'</div><div style="font-size:12px;color:#7a88a8;margin-top:20px;margin-bottom:8px;font-weight:900;text-transform:uppercase">🏆 Топ-3 по сбитым</div>'+top.map((p,i)=>'<div style="padding:10px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center"><b style="color:#fbbf24;font-size:16px">'+(i+1)+'</b><div style="flex:1"><b>'+esc(p.name)+'</b><div style="font-size:11px;color:#7a88a8">'+esc(p.desc||'')+'</div></div><div style="color:#fbbf24;font-weight:900">'+(p.kills||0)+'</div></div>').join('');openModal('statsOverlay')}
function openExportModal(){openModal('exportOverlay')}
function exportJSON(){const data=JSON.stringify(planes,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='shixidik_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);$('exportStatus').textContent='✅ Файл скачан';toast('📤 Экспорт готов')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);showConfirm('Импортировать '+Object.keys(d).length+' записей?','Существующие данные будут перезаписаны.',()=>{db.ref('planes').set(d).then(()=>{closeModal('exportOverlay');toast('📥 Импортировано')})})}catch(err){$('exportStatus').textContent='❌ Ошибка: '+err.message}};r.readAsText(f);e.target.value=''}
function openGameMenu(){openModal('gameMenuOverlay')}
let gameLoop=null,gameState=null;
function startGame(diff){closeModal('gameMenuOverlay');$('gameOverlay').classList.add('active');
const cfg={easy:{lives:5,speed:.8,spawn:2000},normal:{lives:3,speed:1.2,spawn:1500},hard:{lives:1,speed:1.8,spawn:900}}[diff];
const c=$('gameCanvas'),ctx=c.getContext('2d');
gameState={shahids:[],score:0,lives:cfg.lives,wave:1,cfg,houses:[],explosions:[]};
for(let i=0;i<8;i++)gameState.houses.push({x:i*80+20,y:c.height-180,w:70,h:120,c:['#3a2a1a','#4a3a2a','#2a1a0a'][i%3]});
$('gScore').textContent='0';$('gLives').textContent=cfg.lives;$('gWave').textContent='1';
let spawnT=0,last=Date.now();
function loop(){const now=Date.now();const dt=now-last;last=now;spawnT+=dt;
const waveSpeed=gameState.cfg.speed*(1+gameState.wave*.15);
if(spawnT>gameState.cfg.spawn){spawnT=0;const r=Math.random();let type,emoji,hp,score;
if(r<.7){type='normal';emoji='🛩';hp=1;score=10}
else if(r<.9){type='fast';emoji='🚀';hp=1;score=20}
else{type='boss';emoji='✈️';hp=3;score=50}
gameState.shahids.push({x:-60,y:60+Math.random()*260,vx:waveSpeed*(type==='fast'?1.8:1),emoji,hp,score,type})}
const g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#0a0e1a');g.addColorStop(.6,'#1a2a4a');g.addColorStop(1,'#2a1a0a');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#fff';for(let i=0;i<30;i++){const sx=(i*97)%c.width,sy=(i*53)%200;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(sx,sy,1.3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
gameState.houses.forEach(h=>{ctx.fillStyle=h.c;ctx.fillRect(h.x,h.y,h.w,h.h);ctx.fillStyle='rgba(255,180,80,.7)';for(let r=0;r<3;r++){for(let cc=0;cc<3;cc++){ctx.fillRect(h.x+8+cc*22,h.y+12+r*36,14,20)}}});
gameState.explosions=gameState.explosions.filter(ex=>{ex.r+=3;ex.alpha-=.05;ctx.beginPath();ctx.arc(ex.x,ex.y,ex.r,0,Math.PI*2);ctx.fillStyle='rgba(255,150,50,'+Math.max(0,ex.alpha)+')';ctx.fill();return ex.alpha>0});
for(let i=gameState.shahids.length-1;i>=0;i--){const s=gameState.shahids[i];s.x+=s.vx;ctx.save();ctx.shadowColor='rgba(255,100,100,.6)';ctx.shadowBlur=18;ctx.font=(s.type==='boss'?'44px':'36px')+' serif';ctx.textAlign='center';ctx.fillText(s.emoji,s.x,s.y);ctx.restore();
if(s.x>c.width+60){gameState.shahids.splice(i,1);gameState.lives--;$('gLives').textContent=gameState.lives;if(gameState.lives<=0){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.fillText('ИГРА ОКОНЧЕНА',c.width/2,c.height/2-20);ctx.font='bold 22px sans-serif';ctx.fillText('Счёт: '+gameState.score,c.width/2,c.height/2+30);ctx.fillText('Волна: '+gameState.wave,c.width/2,c.height/2+65);if(gameLoop)cancelAnimationFrame(gameLoop);return}}}
if(gameState.score>0&&gameState.score%100===0){gameState.wave++;$('gWave').textContent=gameState.wave}
gameLoop=requestAnimationFrame(loop)}loop();
c.onclick=(e)=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)*(c.width/r.width);const y=(e.clientY-r.top)*(c.height/r.height);for(let i=gameState.shahids.length-1;i>=0;i--){const s=gameState.shahids[i];if(Math.abs(s.x-x)<38&&Math.abs(s.y-y)<38){s.hp--;gameState.explosions.push({x:s.x,y:s.y,r:5,alpha:1});if(s.hp<=0){gameState.shahids.splice(i,1);gameState.score+=s.score;$('gScore').textContent=gameState.score}break}}}
}
function closeGame(){$('gameOverlay').classList.remove('active');if(gameLoop)cancelAnimationFrame(gameLoop);gameLoop=null}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='a'||e.key==='A')openAdminModal();if(e.key==='g'||e.key==='G')openGameMenu();if(e.key==='Escape')document.querySelectorAll('.modal-overlay.active,.preview-overlay.active').forEach(m=>m.classList.remove('active'))});
document.addEventListener('input',e=>{if(e.target.id==='plName'||e.target.id==='plDesc'){localStorage.setItem('shixidik_draft',JSON.stringify({name:$('plName').value,desc:$('plDesc').value}))}});
renderAll();updateAdminUI();console.log('🛩 ШIХiDik v6 — 40 features');
</script></body></html>
