function $(id){return document.getElementById(id)}
function esc(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
function escUrl(u){return String(u||'').replace(/"/g,'%22').replace(/</g,'%3C').replace(/>/g,'%3E')}
function toast(msg,icon){const t=$('toast');t.querySelector('i').className='fas fa-'+(icon||'check');$('toastText').textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(id){$(id).classList.add('active')}
function closeModal(id){$(id).classList.remove('active')}
function showConfirm(title,desc,cb){$('confirmTitle').textContent=title;$('confirmDesc').textContent=desc||'';$('confirmYes').onclick=()=>{closeModal('confirmOverlay');cb()};openModal('confirmOverlay')}
function seedIfEmpty(){if(initialized)return;db.ref('planes').once('value').then(s=>{const d=s.val();if(!d||Object.keys(d).length===0){const u={},now=Date.now();DEFAULT_PLANES.forEach((p,i)=>{u['seed_'+i]={...p,createdAt:now-i*1000,author:'system'}});db.ref('planes').update(u)}});initialized=true}
db.ref('planes').on('value',s=>{planes=s.val()||{};renderAll()});
db.ref('groups').on('value',s=>{groups=s.val()||{};renderAll()});
seedIfEmpty();
function openAdminModal(){if(isAdmin){logoutAdmin();return}$('adminPass').value='';$('adminErr').style.display='none';openModal('adminOverlay')}
function tryAdmin(){const p=$('adminPass').value;if(p===ADMIN_PASS){isAdmin=true;closeModal('adminOverlay');toast('🔓 Режим админа активирован','unlock');updateAdminUI()}else{$('adminErr').textContent='Неверный пароль';$('adminErr').style.display='block';$('adminPass').style.value=''}}
function logoutAdmin(){isAdmin=false;toast('🔒 Режим админа выключен','lock');updateAdminUI()}
function updateAdminUI(){const b=$('adminBtn');b.classList.toggle('active',isAdmin);b.innerHTML=isAdmin?'<i class="fas fa-unlock"></i>':'<i class="fas fa-lock"></i>';$('fabAdd').style.display=isAdmin?'flex':'none';$('adminLogoutBtn').style.display=isAdmin?'flex':'none';$('adminLoginBtn').style.display=isAdmin?'none':'flex';renderAll()}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));btn.classList.add('active');renderAll()}
function renderAll(){
const groupsBlock=$('groupsBlock');const planesBlock=$('planesBlock');
const q=($('searchInput').value||'').toLowerCase().trim();
let groupsList=Object.entries(groups).map(([id,v])=>({id,...v}));
if(q)groupsList=groupsList.filter(g=>(g.name||'').toLowerCase().includes(q));
let html='';
if(groupsList.length>0){
html+='<div class="section-title">🏴 Группы <span class="cnt">'+groupsList.length+'</span></div>';
html+=groupsList.map(g=>{
const cnt=Object.values(planes).filter(p=>p.group===g.id).length;
return '<div class="group-card" '+(isAdmin?'onclick="openEditGroup(\''+g.id+'\')"':'')+'><div class="gc-icon">🏴</div><div class="gc-info"><div class="gc-name">'+esc(g.name)+'</div><div class="gc-desc">'+esc(g.desc||'—')+'</div><div class="gc-cnt">'+cnt+' шахедов</div></div></div>';
}).join('');
}
if(isAdmin){html+='<button class="btn btn-ghost" style="margin-bottom:14px" onclick="openAddGroup()">➕ Создать группу</button>'}
groupsBlock.innerHTML=html;
let items=Object.entries(planes).map(([id,v])=>({id,...v}));
if(currentFilter==='alive')items=items.filter(p=>p.alive!==false);
else if(currentFilter==='dead')items=items.filter(p=>p.alive===false);
else if(currentFilter==='normal')items=items.filter(p=>p.type==='normal');
else if(currentFilter==='combat')items=items.filter(p=>p.type==='combat');
else if(currentFilter==='jet')items=items.filter(p=>p.type==='jet');
else if(currentFilter==='jetcombat')items=items.filter(p=>p.type==='jetcombat');
if(q)items=items.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q));
items.sort((a,b)=>{if((a.alive!==false)!==(b.alive!==false))return a.alive!==false?-1:1;const na=parseInt((a.name||'').replace(/\D/g,''))||0;const nb=parseInt((b.name||'').replace(/\D/g,''))||0;return na-nb});
const all=Object.values(planes);
$('statTotal').textContent=all.length;
$('statAlive').textContent=all.filter(p=>p.alive!==false).length;
$('statDead').textContent=all.filter(p=>p.alive===false).length;
if(items.length===0){planesBlock.innerHTML='<div class="empty"><div class="ic">🛩</div><div class="t">Пусто</div><div class="d">'+(isAdmin?'Добавь первого шахеда кнопкой +':'Войди как админ чтобы добавить')+'</div></div>';return}
const typeLabels={normal:'обычный',combat:'боевой',jet:'реактивный',jetcombat:'реактивно-боевой'};
const typeIcons={normal:'🛩',combat:'⚔️',jet:'🚀',jetcombat:'🔥'};
planesBlock.innerHTML=items.map(p=>{
const isAlive=p.alive!==false;
const emoji=typeIcons[p.type]||'🛩';
const av=p.photo?'<span class="av"><img src="'+escUrl(p.photo)+'" onerror="this.style.display=\'none\';this.parentNode.textContent=\''+emoji+'\'"></span>':'<span class="av">'+emoji+'</span>';
const grp=p.group&&groups[p.group]?'<div class="group">🏴 '+esc(groups[p.group].name)+'</div>':'';
const actions=isAdmin?'<div class="actions">'+(isAlive?'<button class="btn-kill" onclick="event.stopPropagation();toggleAlive(\''+p.id+'\',true)" title="Сбит"><i class="fas fa-skull"></i></button>':'<button class="btn-revive" onclick="event.stopPropagation();toggleAlive(\''+p.id+'\',false)" title="Активен"><i class="fas fa-heart"></i></button>')+'<button class="btn-edit" onclick="event.stopPropagation();openEditPlane(\''+p.id+'\')" title="Ред."><i class="fas fa-pen"></i></button></div>':'';
return '<div class="plane '+(isAlive?'':'dead')+'"><div class="em">'+(p.photo?'<img src="'+escUrl(p.photo)+'" onerror="this.style.display=\'none\';this.parentNode.textContent=\''+emoji+'\'">':emoji)+'</div><div class="info"><div class="name">'+av+esc(p.name||'Без названия')+' <span class="tag '+(p.type||'normal')+'">'+(typeLabels[p.type]||'обычный')+'</span></div>'+grp+'<div class="desc">'+esc(p.desc||'—')+'</div></div>'+actions+'</div>';
}).join('');
}
function toggleAlive(id,kill){db.ref('planes/'+id+'/alive').set(kill?false:true).then(()=>{toast(kill?'☠️ Сбит':'✅ Активен',kill?'skull':'heart')})}
function openAddPlane(){if(!isAdmin){toast('Нужен режим админа','lock');return}editingId=null;$('planeModalTitle').innerHTML='🛩 Новый шахед';$('plName').value='';$('plType').value='normal';$('plGroup').value='';$('plDesc').value='';$('plPhoto').value='';$('plPhotoProgress').textContent='';$('plDeleteBtn').style.display='none';fillGroupSelect();openModal('planeOverlay')}
function openEditPlane(id){if(!isAdmin)return;const p=planes[id];if(!p)return;editingId=id;$('planeModalTitle').innerHTML='✏️ Редактировать';$('plName').value=p.name||'';$('plType').value=p.type||'normal';$('plDesc').value=p.desc||'';$('plPhoto').value=p.photo||'';$('plPhotoProgress').textContent='';$('plDeleteBtn').style.display='block';fillGroupSelect(p.group||'');openModal('planeOverlay')}
function fillGroupSelect(sel){const s=$('plGroup');s.innerHTML='<option value="">— без группы —</option>'+Object.entries(groups).map(([id,g])=>'<option value="'+id+'" '+(id===sel?'selected':'')+'>'+esc(g.name)+'</option>').join('')}
function savePlane(){if(!isAdmin)return;const name=$('plName').value.trim();if(!name){toast('Введи название','times');return}const data={name,type:$('plType').value,desc:$('plDesc').value.trim(),photo:$('plPhoto').value.trim(),group:$('plGroup').value,updatedAt:Date.now()};if(editingId){db.ref('planes/'+editingId).update(data).then(()=>{closeModal('planeOverlay');toast('💾 Сохранено')})}else{data.alive=true;data.createdAt=Date.now();db.ref('planes').push(data).then(()=>{closeModal('planeOverlay');toast('🛩 Добавлено')})}}
function deletePlane(){if(!isAdmin||!editingId)return;showConfirm('Удалить шахеда?','Нельзя отменить.',()=>{db.ref('planes/'+editingId).remove().then(()=>{closeModal('planeOverlay');toast('🗑 Удалено')})})}
function openAddGroup(){if(!isAdmin)return;editingGroupId=null;$('grName').value='';$('grDesc').value='';$('grDeleteBtn').style.display='none';openModal('groupOverlay')}
function openEditGroup(id){if(!isAdmin)return;const g=groups[id];if(!g)return;editingGroupId=id;$('grName').value=g.name||'';$('grDesc').value=g.desc||'';$('grDeleteBtn').style.display='block';openModal('groupOverlay')}
function saveGroup(){if(!isAdmin)return;const name=$('grName').value.trim();if(!name){toast('Введи название','times');return}const data={name,desc:$('grDesc').value.trim(),updatedAt:Date.now()};if(editingGroupId){db.ref('groups/'+editingGroupId).update(data).then(()=>{closeModal('groupOverlay');toast('💾 Сохранено')})}else{data.createdAt=Date.now();db.ref('groups').push(data).then(()=>{closeModal('groupOverlay');toast('🏴 Создано')})}}
function deleteGroup(){if(!isAdmin||!editingGroupId)return;showConfirm('Удалить группу?','Шахеды останутся, но потеряют группу.',()=>{const gid=editingGroupId;const upd={};Object.entries(planes).forEach(([id,p])=>{if(p.group===gid)upd['planes/'+id+'/group']=''});upd['groups/'+gid]=null;db.ref().update(upd).then(()=>{closeModal('groupOverlay');toast('🗑 Удалено')})})}
$('planePhotoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const prog=$('plPhotoProgress');prog.innerHTML='<i class="fas fa-spinner fa-spin"></i> Загрузка...';const fd=new FormData();fd.append('image',f);fd.append('key',IMGBB_KEY);fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{if(!d.success)throw new Error('ImgBB');$('plPhoto').value=d.data.url;prog.innerHTML='<i class="fas fa-check-circle" style="color:#16a34a"></i> Загружено'}).catch(()=>{prog.innerHTML='<i class="fas fa-times-circle" style="color:#dc2626"></i> Ошибка'});e.target.value=''});
/* ==== GAME ==== */
let gameLoop=null,gameShahids=[],gameScore=0,gameLives=3,gameHouses=[];
function openGame(){$('gameOverlay').classList.add('active');startGame()}
function closeGame(){$('gameOverlay').classList.remove('active');if(gameLoop)cancelAnimationFrame(gameLoop);gameLoop=null}
function startGame(){const c=$('gameCanvas');const ctx=c.getContext('2d');gameShahids=[];gameScore=0;gameLives=3;gameHouses=[];for(let i=0;i<8;i++){gameHouses.push({x:i*80+20,y:c.height-180,w:70,h:120,c:['#8b5a3c','#a06a4a','#7a4a2c'][i%3]})}$('gameScore').textContent='0';$('gameLives').textContent='3';let spawnT=0;let last=Date.now();
function loop(){const now=Date.now();const dt=now-last;last=now;spawnT+=dt;if(spawnT>1500){spawnT=0;gameShahids.push({x:-60,y:60+Math.random()*260,vx:1.5+Math.random()*1.5,emoji:['🛩','🚀','✈️'][Math.floor(Math.random()*3)],hit:false})}
ctx.fillStyle='#0d1424';ctx.fillRect(0,0,c.width,c.height);
const g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#1a2a4a');g.addColorStop(.6,'#3a4a6a');g.addColorStop(1,'#5a4a3a');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#f5f7ff';for(let i=0;i<20;i++){const sx=(i*97)%c.width,sy=(i*53)%200;ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
gameHouses.forEach(h=>{ctx.fillStyle=h.c;ctx.fillRect(h.x,h.y,h.w,h.h);ctx.fillStyle='#2a1a0a';for(let r=0;r<3;r++){for(let cc=0;cc<3;cc++){ctx.fillRect(h.x+8+cc*22,h.y+12+r*36,14,20)}}});
for(let i=gameShahids.length-1;i>=0;i--){const s=gameShahids[i];s.x+=s.vx;ctx.save();ctx.shadowColor='rgba(255,100,100,.5)';ctx.shadowBlur=15;ctx.font='36px serif';ctx.textAlign='center';ctx.fillText(s.emoji,s.x,s.y);ctx.restore();if(s.x>c.width+60){gameShahids.splice(i,1);gameLives--;$('gameLives').textContent=gameLives;if(gameLives<=0){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText('ИГРА ОКОНЧЕНА',c.width/2,c.height/2);ctx.font='bold 24px sans-serif';ctx.fillText('Счёт: '+gameScore,c.width/2,c.height/2+50);setTimeout(()=>{if(gameLoop)cancelAnimationFrame(gameLoop)},100);return}}}
gameLoop=requestAnimationFrame(loop)}loop();
c.onclick=(e)=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)*(c.width/r.width);const y=(e.clientY-r.top)*(c.height/r.height);for(let i=gameShahids.length-1;i>=0;i--){const s=gameShahids[i];if(Math.abs(s.x-x)<35&&Math.abs(s.y-y)<35){gameShahids.splice(i,1);gameScore+=10;$('gameScore').textContent=gameScore;break}}}}
renderAll();updateAdminUI();console.log('🛩 ШIХiDik — реестр воздушных целей');
</script></body></html>
