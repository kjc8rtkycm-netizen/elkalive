<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>elkalive — Билеты</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#050a08;--bg2:#0a1410;--bg3:#0f1e18;--bg4:#152a22;--text:#eef7f1;--text2:#8fb3a3;--text3:#5a7a6c;--amber:#facc15;--amber2:#f59e0b;--amber3:#fde047;--amber-soft:rgba(250,204,21,.12);--amber-glow:rgba(250,204,21,.6);--border:rgba(250,204,21,.18)}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
.header{display:flex;align-items:center;gap:10px;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:linear-gradient(180deg,var(--bg2),transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--amber3),var(--amber),var(--amber2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#000;font-weight:900;box-shadow:0 6px 24px var(--amber-glow);flex-shrink:0}
.back{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.brand{flex:1;font-size:17px;font-weight:900}
.brand span{color:var(--amber)}
.container{padding:14px;max-width:800px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--amber-soft),transparent);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px;text-align:center}
.hero .hero-icon{font-size:32px;margin-bottom:8px}
.hero h1{font-size:17px;font-weight:900;color:var(--amber);margin-bottom:4px;filter:drop-shadow(0 0 8px var(--amber-glow))}
.hero p{font-size:12px;color:var(--text2)}
.search-card{background:linear-gradient(135deg,var(--bg3),var(--bg4));border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:16px}
.field{margin-bottom:12px;position:relative}
.field label{font-size:10.5px;color:var(--amber);display:block;margin-bottom:7px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.btn{width:100%;padding:15px;border:none;border-radius:13px;background:linear-gradient(135deg,var(--amber3),var(--amber),var(--amber2));color:#000;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 24px var(--amber-glow)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5}
.suggestions{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--amber);border-radius:12px;margin-top:4px;max-height:280px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.suggestions.show{display:block}
.suggestion{padding:12px 15px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.suggestion:active{background:var(--amber-soft);color:var(--amber)}
.suggestion:last-child{border-bottom:none}
.suggestion .region{font-size:10px;color:var(--text3);margin-top:2px}
.route-card{background:linear-gradient(135deg,var(--bg3),var(--bg4));border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.route-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--amber3),var(--amber2));box-shadow:0 0 14px var(--amber-glow)}
.route-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.route-number{font-size:16px;font-weight:900;color:var(--amber);display:flex;align-items:center;gap:6px}
.route-class{font-size:10px;font-weight:900;padding:4px 10px;border-radius:8px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);white-space:nowrap;text-transform:uppercase}
.route-time{font-size:24px;font-weight:900;letter-spacing:-.5px;margin-bottom:8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-time .arrow{color:var(--amber);font-size:18px}
.route-duration{font-size:12px;color:var(--text2);font-weight:700;background:var(--bg);padding:3px 8px;border-radius:6px;border:1px solid var(--border)}
.route-stations{font-size:12.5px;color:var(--text2);margin-bottom:10px;line-height:1.5;display:flex;align-items:flex-start;gap:6px}
.route-stations i{color:var(--amber);margin-top:2px}
.route-vehicle{font-size:12px;color:var(--amber);font-weight:800;padding:7px 12px;background:var(--amber-soft);border-radius:9px;display:inline-block;margin-bottom:10px;border:1px solid var(--border)}
.route-meta{font-size:11.5px;color:var(--text3);margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap}
.route-meta .price{color:var(--amber);font-weight:900;font-size:14px}
.route-buy{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--amber3),var(--amber),var(--amber2));color:#000;text-decoration:none;font-weight:900;font-size:13px;padding:11px 22px;border-radius:11px;box-shadow:0 6px 20px var(--amber-glow);width:100%;justify-content:center;margin-bottom:10px}
.route-buy:active{transform:scale(.97)}
.stops-toggle{background:none;border:1px solid var(--border);color:var(--amber);font-weight:800;font-size:12px;padding:9px 16px;border-radius:10px;cursor:pointer;font-family:inherit;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.stops-toggle:active{background:var(--amber-soft)}
.stops-list{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.stops-list.show{display:block}
.stop-item{display:flex;justify-content:space-between;padding:8px 0;font-size:12px;border-bottom:1px solid var(--border);gap:10px}
.stop-item:last-child{border-bottom:none}
.stop-item .stop-name{color:var(--text);flex:1;font-weight:600}
.stop-item .stop-time{color:var(--amber);font-weight:800;white-space:nowrap}
.stop-item .stop-time.arr{color:var(--text2);font-weight:600}
.loader{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .9s linear infinite;margin:50px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{text-align:center;color:var(--text2);font-size:12px;margin-top:8px;line-height:1.6}
.empty{text-align:center;padding:50px 20px;color:var(--text2)}
.empty .ic{font-size:48px;color:var(--amber);opacity:.35;margin-bottom:14px}
.empty .t{font-size:14px;font-weight:800;color:var(--text);margin-bottom:6px}
.empty .d{font-size:12px;line-height:1.5}
.results-title{font-size:11px;color:var(--amber);font-weight:900;text-transform:uppercase;margin:20px 0 12px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back"><i class="fas fa-arrow-left"></i></a>
<div class="logo">Э</div>
<div class="brand">elka<span>live</span> • Билеты</div>
</div>
<div class="container">
<div class="hero">
<div class="hero-icon">🎫</div>
<h1>Поиск билетов</h1>
<p>Введи станции и дату — покажем все рейсы</p>
</div>
<div class="search-card">
<div class="field">
<label><i class="fas fa-map-pin"></i> Откуда</label>
<input type="text" id="fromInput" placeholder="Москва (Ярославский вокзал)" autocomplete="off">
<div class="suggestions" id="fromSuggestions"></div>
</div>
<div class="field">
<label><i class="fas fa-flag-checkered"></i> Куда</label>
<input type="text" id="toInput" placeholder="Сергиев Посад" autocomplete="off">
<div class="suggestions" id="toSuggestions"></div>
</div>
<div class="field">
<label><i class="fas fa-calendar"></i> Дата</label>
<input type="date" id="dateInput">
</div>
<button class="btn" id="searchBtn" onclick="searchRoutes()"><i class="fas fa-magnifying-glass"></i> Найти рейсы</button>
</div>
<div id="results"></div>
</div>
<script>
const FB_URL='https://nexik-63c6c-default-rtdb.firebaseio.com';
const WORKER_URL='https://purple-voice-50df.sashurovpelmen.workers.dev';
let allStations=[];
let fromStation=null;
let toStation=null;
let stationsLoaded=false;
document.getElementById('dateInput').valueAsDate=new Date();

async function loadStations(){
  if(stationsLoaded)return;
  try{
    const res=await fetch(FB_URL+'/stations.json');
    const data=await res.json();
    allStations=Object.values(data||{});
    stationsLoaded=true;
    console.log('Загружено станций:',allStations.length);
  }catch(e){console.error('Ошибка загрузки станций:',e)}
}
function showSuggestions(input,container,type){
  const q=input.value.trim().toLowerCase();
  if(q.length<2){container.classList.remove('show');return}
  const matches=allStations.filter(s=>(s.title||'').toLowerCase().includes(q)).slice(0,10);
  if(matches.length===0){container.classList.remove('show');return}
  container.innerHTML=matches.map(s=>'<div class="suggestion" onclick="selectStation(\''+type+'\',\''+s.code+'\')"><div>'+escHtml(s.title)+'</div><div class="region">'+escHtml(s.region||'')+'</div></div>').join('');
  container.classList.add('show');
}
function selectStation(type,code){
  const st=allStations.find(s=>s.code===code);
  if(!st)return;
  if(type==='from'){fromStation=st;document.getElementById('fromInput').value=st.title;document.getElementById('fromSuggestions').classList.remove('show')}
  else{toStation=st;document.getElementById('toInput').value=st.title;document.getElementById('toSuggestions').classList.remove('show')}
}
function escHtml(t){const d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML}
function fmtTime(iso){if(!iso)return'—';const d=new Date(iso);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function fmtDuration(sec){if(!sec)return'';const m=Math.round(sec/60);if(m<60)return m+'мин';const h=Math.floor(m/60);const rm=m%60;return h+'ч '+(rm?rm+'мин':'')}

async function searchRoutes(){
  if(!fromStation||!toStation){alert('Выберите станции из подсказок');return}
  const date=document.getElementById('dateInput').value;
  if(!date){alert('Выберите дату');return}
  const btn=document.getElementById('searchBtn');
  btn.disabled=true;
  btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Загрузка...';
  const results=document.getElementById('results');
  results.innerHTML='<div class="loader"></div><div class="loading-text">Запрашиваю рейсы у Яндекса...<br>Это может занять 20-60 секунд<br>Не закрывай страницу</div>';

  // Генерируем ID запроса
  const reqId = 'req_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);

  try {
    // 1. Пишем запрос в Firebase (CORS-friendly)
    await fetch(FB_URL + '/search_queue/' + reqId + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: fromStation.code, to: toStation.code, date: date, ts: Date.now() })
    });

    // 2. Пинуем Worker чтобы он обработал очередь
    // (делаем это без await, чтобы не ждать)
    fetch(WORKER_URL + '/process').catch(() => {});

    // 3. Слушаем результат в Firebase
    let attempts = 0;
    const maxAttempts = 60; // 60 * 2 сек = 120 сек максимум
    const checkInterval = setInterval(async () => {
      attempts++;
      try {
        const r = await fetch(FB_URL + '/search_results/' + reqId + '.json');
        const result = await r.json();

        if (result && result.data) {
          clearInterval(checkInterval);
          // Удаляем результат и запрос
          fetch(FB_URL + '/search_results/' + reqId + '.json', { method: 'DELETE' });
          fetch(FB_URL + '/search_queue/' + reqId + '.json', { method: 'DELETE' });

          renderResults(result.data);
          btn.disabled=false;
          btn.innerHTML='<i class="fas fa-magnifying-glass"></i> Найти рейсы';
          return;
        }
      } catch(e) { /* игнорируем, продолжаем ждать */ }

      if (attempts >= maxAttempts) {
        clearInterval(checkInterval);
        results.innerHTML='<div class="empty"><div class="ic"><i class="fas fa-clock"></i></div><div class="t">Превышено время ожидания</div><div class="d">Яндекс долго не отвечает. Попробуй позже.</div></div>';
        btn.disabled=false;
        btn.innerHTML='<i class="fas fa-magnifying-glass"></i> Найти рейсы';
      }
    }, 2000);

  } catch(e) {
    results.innerHTML='<div class="empty"><div class="ic"><i class="fas fa-triangle-exclamation"></i></div><div class="t">Ошибка</div><div class="d">'+escHtml(e.message)+'</div></div>';
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-magnifying-glass"></i> Найти рейсы';
  }
}

function renderResults(data){
  const results=document.getElementById('results');
  if(data.error){
    results.innerHTML='<div class="empty"><div class="ic"><i class="fas fa-triangle-exclamation"></i></div><div class="t">Ошибка</div><div class="d">'+escHtml(typeof data.error==='string'?data.error:JSON.stringify(data.error))+'</div></div>';
    return;
  }
  const segs=data.segments||[];
  if(segs.length===0){
    results.innerHTML='<div class="empty"><div class="ic"><i class="fas fa-train"></i></div><div class="t">Рейсов не найдено</div><div class="d">Попробуй другую дату или другие станции</div></div>';
    return;
  }
  segs.sort((a,b)=>new Date(a.departure)-new Date(b.departure));
  results.innerHTML='<div class="results-title"><i class="fas fa-check-circle"></i> Найдено рейсов: '+segs.length+'</div>'+segs.map((s,i)=>renderRoute(s,i)).join('');
}

function renderRoute(seg, idx){
  const num=seg.thread?.number||'—';
  const dep=fmtTime(seg.departure);
  const arr=fmtTime(seg.arrival);
  const dur=fmtDuration(seg.duration);
  const vehicle=seg.thread?.vehicle||null;
  const carrier=seg.thread?.carrier?.title||'';
  const cls=seg.thread?.express_type||seg.thread?.transport_subtype?.title||'';
  const price=seg.tickets_info?.places?.[0]?.price?.whole;
  const fromName=seg.from?.title||'';
  const toName=seg.to?.title||'';
  const dateStr=(seg.departure||'').split('T')[0];
  const buyUrl='https://rasp.yandex.ru/search/suburban/?fromName='+encodeURIComponent(fromName)+'&toName='+encodeURIComponent(toName)+'&when='+dateStr;
  const isSuburban=seg.thread?.transport_type==='suburban';
  const icon=isSuburban?'⚡':'🚂';
  const typeLabel=isSuburban?'Электричка':'Поезд';
  const stops=seg.stops||[];
  const stopsId='stops_'+idx;

  let stopsHtml='';
  if(stops.length>0){
    stopsHtml='<button class="stops-toggle" onclick="document.getElementById(\''+stopsId+'\').classList.toggle(\'show\')"><i class="fas fa-list"></i> Показать остановки ('+stops.length+')</button><div class="stops-list" id="'+stopsId+'">'+stops.map(s=>{
      const arrT=s.arrival?fmtTime(s.arrival):'';
      const depT=s.departure?fmtTime(s.departure):'';
      let timeStr='';
      if(arrT&&depT) timeStr=arrT+' → '+depT;
      else if(depT) timeStr='→ '+depT;
      else if(arrT) timeStr='← '+arrT;
      return '<div class="stop-item"><div class="stop-name">'+escHtml(s.station)+'</div><div class="stop-time">'+timeStr+'</div></div>';
    }).join('')+'</div>';
  }

  return '<div class="route-card"><div class="route-head"><div class="route-number">'+icon+' '+escHtml(num)+'</div>'+(cls?'<div class="route-class">'+escHtml(cls)+'</div>':'')+'</div><div class="route-time">'+dep+' <span class="arrow">→</span> '+arr+' <span class="route-duration">'+(dur?'('+dur+')':'')+'</span></div><div class="route-stations"><i class="fas fa-map-pin"></i> <span>'+escHtml(fromName)+' → '+escHtml(toName)+'</span></div>'+(vehicle?'<div class="route-vehicle">🚂 '+escHtml(vehicle)+'</div>':'')+'<div class="route-meta"><span><i class="fas fa-train"></i>'+typeLabel+'</span>'+(carrier?'<span><i class="fas fa-building"></i>'+escHtml(carrier)+'</span>':'')+(price?'<span class="price"><i class="fas fa-ruble-sign"></i>'+price+' ₽</span>':'')+'</div>'+stopsHtml+'<div style="height:10px"></div><a class="route-buy" href="'+buyUrl+'" target="_blank" rel="noopener"><i class="fas fa-ticket"></i> Купить на Яндекс</a></div>';
}

document.getElementById('fromInput').addEventListener('input',function(){showSuggestions(this,document.getElementById('fromSuggestions'),'from')});
document.getElementById('fromInput').addEventListener('focus',function(){loadStations()});
document.getElementById('toInput').addEventListener('input',function(){showSuggestions(this,document.getElementById('toSuggestions'),'to')});
document.getElementById('toInput').addEventListener('focus',function(){loadStations()});
document.addEventListener('click',function(e){if(!e.target.closest('.field')){document.querySelectorAll('.suggestions').forEach(s=>s.classList.remove('show'))}});
loadStations();
</script>
</body>
</html>
